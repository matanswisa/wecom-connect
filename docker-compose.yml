services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wecomconnect
      POSTGRES_USER: wecomconnect
      POSTGRES_PASSWORD: wecomconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wecomconnect -d wecomconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
