services:
  app:
    build:
      context: .
    environment:
      SQLITE_PATH: /app/data/wecomconnect.db
      AUTH_SECRET: ${AUTH_SECRET:-development-docker-secret-change-me}
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - sqlite-data:/app/data

volumes:
  sqlite-data:
